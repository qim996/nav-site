<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻舟导航 · 个人导航</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
<link rel="preconnect" href="https://icon.horse">
<link rel="preconnect" href="https://api.quickso.cn">
<style>
  :root{
    --bg:#EEEBE4;
    --surface:#F7F4ED;
    --surface-2:#E7E2D8;
    --primary:#6E7A72;
    --primary-deep:#59645D;
    --primary-soft:#DDE2DA;
    --ink:#3B3A36;
    --ink-2:#6E6A61;
    --ink-3:#9A958B;
    --line:#DDD8CC;
    --success:#7A8B7D;
    --danger:#B36B62;
    --radius:16px;
    --shadow:0 1px 2px rgba(59,58,54,.05),0 10px 28px -14px rgba(59,58,54,.16);
    --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
  a{color:inherit;text-decoration:none}
  .num{font-variant-numeric:tabular-nums}
  /* ===== 顶栏 ===== */
  .topbar{background:transparent}
  .topbar-inner{
    max-width:1080px;margin:0 auto;padding:0 20px;
    height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,#8FA094,#6E7A72);
    display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
  }
  .topnav{display:flex;align-items:center;gap:6px}
  .topnav button{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:10px;border:none;background:transparent;
    font-size:14px;color:var(--ink-2);font-weight:500;
    transition:background .15s,color .15s;
  }
  .topnav button:hover{background:var(--surface-2);color:var(--ink)}
  .topnav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .topnav .icon-btn-only{padding:8px}
  /* ===== 主容器 ===== */
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
  /* ===== Hero ===== */
  .hero{padding:26px 0 30px;text-align:center}
  .clock-time{font-size:clamp(50px,9vw,76px);font-weight:900;letter-spacing:3px;line-height:1.08}
  .clock-date{color:var(--ink-2);font-size:16px;margin-top:8px;letter-spacing:1px}
  .weather{
    display:inline-flex;align-items:center;gap:8px;margin-top:18px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:7px 18px;font-size:14px;color:var(--ink-2);
  }
  .weather .w-name{font-weight:600;color:var(--ink)}
  .weather .w-temp{font-weight:800;color:var(--primary);font-size:17px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block}
  .search-box{
    display:flex;align-items:center;gap:10px;max-width:560px;margin:22px auto 0;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:6px 6px 6px 16px;box-shadow:0 8px 24px -14px rgba(15,23,42,.18);
    transition:border-color .15s,box-shadow .15s;
  }
  .search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
  .search-ico{width:18px;height:18px;color:var(--ink-3);flex:none}
  .search-box input{
    flex:1;min-width:0;border:none;background:transparent;outline:none;
    font-size:15px;color:var(--ink);font-family:inherit;
  }
  .search-box input::placeholder{color:var(--ink-3)}
  .search-box .btn{border-radius:10px;padding:9px 18px}
  .announce{
    display:flex;align-items:center;gap:8px;margin:0 0 14px;
    background:linear-gradient(135deg, rgba(158,172,234,.14), rgba(158,172,234,.28));
    border:1px solid rgba(158,172,234,.5);border-radius:12px;
    padding:10px 14px;font-size:14px;color:var(--ink);
  }
  .cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .cat-bar button{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .cat-bar button:hover{color:var(--ink)}
  .cat-bar button.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .cat-bar .cat-dot{width:7px;height:7px;border-radius:50%;flex:none}
  /* ===== 卡片网格 ===== */
  .section-title{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin:10px 0 16px;
  }
  .section-title h2{font-size:18px;font-weight:700}
  .section-title .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .section-title span.count{font-size:13px;color:var(--ink-3)}
  .goods-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));
    gap:14px;
  }
  .card{
    position:relative;overflow:hidden;
    background:var(--cbg,#C8C3B8);
    border-radius:16px;box-shadow:var(--shadow);
    transition:transform .15s,box-shadow .15s;
    color:var(--cfg,#4A4742);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:pan-y;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px rgba(59,58,54,.3)}
  .card:hover .card-icon{transform:scale(1.07)}
  .card-link{position:absolute;inset:0;z-index:1;border-radius:16px}
  .card-body{display:flex;align-items:center;gap:12px;padding:14px;position:relative}
  .card-char{
    position:absolute;right:10px;top:-2px;
    font-size:54px;font-weight:900;line-height:1;opacity:.14;
    pointer-events:none;user-select:none;
    color:var(--cfg,#4A4742);
  }
  .card-icon{
    position:relative;width:46px;height:46px;flex:none;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.62);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
    overflow:hidden;
    transition:transform .15s ease;
  }
  .icon-char{font-size:20px;font-weight:900;line-height:1;color:var(--cfg,#4A4742)}
  .card-icon .favicon{
    position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);
    object-fit:contain;border-radius:7px;display:block;
  }
  .card-info{flex:1;min-width:0}
  .card-line1{display:flex;align-items:center;gap:8px;min-width:0}
  .card-name{font-size:16px;font-weight:800;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-tag{
    flex:none;font-size:11px;padding:2px 9px;border-radius:999px;
    background:rgba(255,255,255,.42);color:var(--cfg,#4A4742);
  }
  .card-desc{opacity:.78;font-size:12.5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:10px;padding:0 16px;
    font-size:14px;font-weight:600;color:#fff;background:var(--primary);
    transition:background .15s,transform .05s;
    min-height:40px;white-space:nowrap;
  }
  .btn:hover{background:var(--primary-deep)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{padding:6px 12px;font-size:13px;min-height:34px;border-radius:9px}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid #F3C8C8}
  .btn.danger:hover{background:#FEF2F2}
  /* 卡片操作按钮（仅编辑模式显示） */
  .card-ops{
    position:absolute;top:8px;right:8px;z-index:5;
    display:flex;gap:6px;
  }
  .card-ops button{
    width:28px;height:28px;border:none;border-radius:50%;
    background:rgba(255,255,255,.94);color:var(--cfg,#4A4742);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.16);
    cursor:pointer;
  }
  .card-ops button:hover{background:#fff;transform:scale(1.06)}
  .card-ops button:active{transform:scale(.94)}
  .card-ops button.del:hover{color:var(--danger)}
  /* 拖动中的卡片（ghost，固定定位跟随指针，样式内联设置） */
  .card.dragging{
    pointer-events:none;opacity:.95;
    box-shadow:0 22px 46px -14px rgba(15,23,42,.42);
  }
  /* 拖动时的原位占位（静态，不参与排序） */
  .card-ph{
    background:rgba(255,255,255,.35);
    border:1.5px dashed rgba(110,122,114,.4);
    border-radius:16px;
  }
  /* ===== 空态 ===== */
  .empty{
    text-align:center;padding:56px 20px;color:var(--ink-3);
    background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty strong{display:block;color:var(--ink-2);font-size:15px;margin-top:10px}
  /* ===== 弹层 ===== */
  .mask{
    position:fixed;inset:0;z-index:60;
    background:rgba(17,24,39,.45);
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  .mask.open{display:flex}
  .modal{
    width:100%;max-width:440px;max-height:92vh;overflow:auto;
    background:var(--surface);border-radius:20px;
    box-shadow:0 24px 60px -20px rgba(15,23,42,.4);
    animation:pop .18s ease-out;
  }
  .modal.wide{max-width:560px}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:1px solid var(--line);
  }
  .modal-head h3{font-size:16px;font-weight:700}
  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:none;background:transparent;
    color:var(--ink-3);display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .modal-body{padding:20px}
  .confirm-ico{
    width:48px;height:48px;margin:0 auto 14px;border-radius:50%;
    background:#FBE9E7;color:var(--danger);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:900;line-height:1;
  }
  /* ===== 表单 ===== */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    background:var(--surface);transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12);
  }
  .field textarea{resize:vertical;min-height:80px}
  /* 自定义分类下拉（替代原生 select，支持圆角样式） */
  .dd{position:relative}
  .dd-trigger{
    width:100%;height:40px;display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);
    padding:0 12px;font-size:14px;color:var(--ink);cursor:pointer;
    transition:border-color .15s,box-shadow .15s;
  }
  .dd-trigger:hover{border-color:var(--primary)}
  .dd-trigger.open{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .dd-dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  .dd-label{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-chev{width:16px;height:16px;color:var(--ink-3);transition:transform .15s;flex:none}
  .dd-trigger.open .dd-chev{transform:rotate(180deg)}
  .dd-menu{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 16px 36px -12px rgba(15,23,42,.28);
    padding:6px;display:none;max-height:240px;overflow:auto;
  }
  .dd-menu.open{display:block}
  .dd-opt{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:9px 10px;border:none;border-radius:6px;background:transparent;
    font-size:14px;color:var(--ink);cursor:pointer;text-align:left;
  }
  .dd-opt:hover{background:var(--surface-2)}
  .dd-opt.sel{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .dd-opt .check{margin-left:auto;color:var(--primary)}
  .dd-empty{padding:10px;text-align:center;color:var(--ink-3);font-size:13px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .row{display:flex;gap:10px;align-items:center}
  .row .grow{flex:1}
  .hint{font-size:12.5px;color:var(--ink-3);line-height:1.7}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;color:var(--ink-2);font-weight:600}
  .seg button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  /* 颜色选择 */
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .swatch{
    width:32px;height:32px;border-radius:10px;border:3px solid transparent;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .swatch.active{border-color:#3A3A3A;box-shadow:0 0 0 2px #fff inset,inset 0 0 0 1px rgba(0,0,0,.06)}
  .swatch.custom{width:32px;height:32px;padding:0;border:1px dashed var(--line);border-radius:10px;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .swatch.custom input{width:100%;height:100%;border:none;padding:0;cursor:pointer;opacity:0}
  .swatch.custom span{position:absolute;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
  /* 分类管理列表 */
  .cat-row{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--bg)}
  .cat-row .c-color{width:30px;height:30px;border-radius:8px;border:none;padding:0;cursor:pointer;flex:none}
  .cat-row .c-name{flex:1;height:36px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:transparent;font-weight:600}
  .cat-row .c-name:hover{border-color:var(--line);background:var(--surface)}
  .cat-row .c-name:focus{outline:none;border-color:var(--primary);background:var(--surface)}
  .cat-row .c-count{font-size:12px;color:var(--ink-3);flex:none;min-width:44px;text-align:right}
  /* ===== Toast ===== */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#1F2933;color:#fff;font-size:13.5px;padding:11px 20px;border-radius:12px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:90;box-shadow:0 10px 30px rgba(15,23,42,.3);
    display:flex;align-items:center;gap:8px;max-width:88vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 编辑模式完成按钮（右下角，避免与居中 toast 重叠） */
  .fixed-done{
    position:fixed;right:24px;bottom:24px;z-index:70;
    box-shadow:0 10px 30px rgba(15,23,42,.28);
  }
  /* ===== 密码锁屏 ===== */
  .lock{
    position:fixed;inset:0;z-index:200;
    background:var(--bg);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .lock.open{display:flex}
  .lock-card{
    width:100%;max-width:360px;text-align:center;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:34px 28px 28px;box-shadow:var(--shadow);
  }
  .lock-card .brand-mark{margin:0 auto 14px;width:52px;height:52px;border-radius:14px}
  .lock-card .lock-title{font-size:18px;font-weight:800;margin-bottom:4px}
  .lock-card .lock-sub{font-size:13px;color:var(--ink-3);margin-bottom:20px}
  .lock-card .lock-input{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;
    padding:0 14px;text-align:center;font-size:16px;letter-spacing:2px;outline:none;background:#fff;
    transition:border-color .15s,box-shadow .15s;
  }
  .lock-card .lock-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .lock-card .btn{width:100%;margin-top:14px;min-height:44px}
  /* ===== 页脚 ===== */
  @media (max-width:640px){
    .wrap{padding:20px 16px 56px}
    .hero h1{font-size:24px}
    .goods-grid{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
    .topnav button span.hide-sm{display:none}
  }
</style>
</head>
<body>
<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <nav class="topnav">
      <button id="addLinkBtn" title="添加网站">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hide-sm">添加网站</span>
      </button>
      <button id="catBtn" title="管理分类">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="hide-sm">分类</span>
      </button>
      <button id="settingsBtn" class="icon-btn-only" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="lockBtn" class="icon-btn-only" title="锁定" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
    </nav>
  </div>
</header>
<main class="wrap">
  <!-- ===== 首页（唯一页面，直接可编辑） ===== -->
  <section id="homeView">
    <div class="hero">
      <div class="clock-time num" id="clockTime">--:--:--</div>
      <div class="clock-date num" id="clockDate"></div>
      <div class="weather" id="weatherBox" style="display:none"><span class="dot"></span><span id="weatherText">加载天气…</span></div>
      <form class="search-box" id="searchForm">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="搜索…" autocomplete="off" spellcheck="false">
        <button class="btn sm" type="submit">搜索</button>
      </form>
    </div>
    <div class="announce" id="announceBar" style="display:none"><span id="announceText"></span></div>
    <div class="section-title">

/* 根据任意颜色自动计算可读前景色 */
function fgOf(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if(!m) return '#4A4742';
  const n = parseInt(m[1],16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#4A4742' : '#FFFFFF';
}
function hostOf(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }
  catch(e){ return String(u||'').replace(/^https?:\/\//,'').split('/')[0]; }
}
/* 网站图标（favicon）：取完整 hostname（保留 www，京东/美团等需带 www 才有完整图标） */
function favDomain(u){
  try{ return new URL(u).hostname; }
  catch(e){ return String(u||'').replace(/^https?:\/\//,'').split('/')[0]; }
}
/* favicon 候选源：icon.horse(高清) -> quickso(备用)，域名保留 www 以获得完整图标 */

  'https://icon.horse/icon/' + d,
  'https://api.quickso.cn/api/favicon/index.php?url=' + d
];
function favFail(el){
  const cands = FAV_CANDIDATES(el.dataset.d);
  const i = (parseInt(el.dataset.i||'0',10)||0) + 1;
  if(i < cands.length){
    el.dataset.i = i;
    el.src = cands[i];
  } else {
    el.style.display = 'none';
  }
}
function normUrl(u){
  u = (u||'').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;

}

function loadStore(){

    const raw = localStorage.getItem(STORE_KEY);

        if(!d.settings) d.settings = seedStore().settings;
        else d.settings = Object.assign({}, seedStore().settings, d.settings);
        return d;
      }
    }
  }catch(e){}
  return seedStore();
}

function renderHome(){
  const s = store.settings;

      store.categories.map(c=>`<button class="${homeCat===c.id?'active':''}" data-cat="${esc(c.id)}"><span class="cat-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('');
  } else {
    catBar.innerHTML = '';
  }
  // 过滤
  let list = store.links;
  if(homeCat && homeCat!=='all') list = list.filter(l => l.cat===homeCat);
  $('#linkCount').textContent = '共 ' + list.length + ' 个网站';
  const grid = $('#goodsGrid'), empty = $('#goodsEmpty');
  if(!list.length){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = list.map(cardHTML).join('');
}
function cardHTML(l){
  const cbg = l.color || '#C8C3B8';
  const cfg = fgOf(cbg);
  const ch = (l.name||'?').trim().charAt(0) || '?';
  const url = normUrl(l.url);
  const host = hostOf(url) || '';
  const domain = favDomain(url) || host;
  const desc = l.desc || url;
  const fav = domain
    ? `<img class="favicon" data-d="${esc(domain)}" data-i="0" src="${esc(FAV_CANDIDATES(domain)[0])}" alt="" draggable="false" onerror="favFail(this)">`
    : '';
  const ops = editMode ? `
    <div class="card-ops">
      <button data-op="edit" data-id="${esc(l.id)}" title="编辑">${IC.edit}</button>
      <button data-op="del" data-id="${esc(l.id)}" class="del" title="删除">${IC.trash}</button>
    </div>` : '';
  return `
  <div class="card" data-id="${esc(l.id)}" style="--cbg:${esc(cbg)};--cfg:${cfg}">
    <a class="card-link" href="${esc(url)}" target="_blank" rel="noopener nofollow" draggable="false" aria-label="访问 ${esc(l.name)}"></a>
    <span class="card-char">${esc(ch)}</span>
    <div class="card-body">

          <span class="card-tag">${esc(catName(l.cat))}</span>
        </div>
        <div class="card-desc">${esc(desc)}</div>
      </div>
    </div>
    ${ops}
  </div>`;
}

      b.onclick = ()=>{ select(hex, b); };

      b.className += ' custom';
      b.innerHTML = '<input type="color" value="'+hex+'" aria-label="自定义颜色">' + '<span>…</span>';
      const inp = b.querySelector('input');
      inp.onchange = ()=>{ select(inp.value, b); };
    }
    return b;
  };
  function select(hex, el){
    active = hex;
    $$('.swatch', box).forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    linkColor = hex;
  }
  MORANDI.forEach(m => box.appendChild(mk(m[0], false)));
  box.appendChild(mk(active, true));
  linkColor = active;
}

  if(!force && weatherLoaded) return;   // 会话内只加载一次

  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh')

        .then(r=>r.json())

    if(e.target.closest('#lfManageCat')){ renderCatList(); openMask($('#catMask')); return; }

    if(e.target.closest('#s-save')){ saveSettings(); return; }

    if(e.target.closest('#s-import-toggle')){ $('#importZone').style.display = $('#importZone').style.display==='block' ? 'none' : 'block'; return; }
    if(e.target.closest('#s-import-apply')){ importData(); return; }
    if(e.target.closest('#s-reset')){
      confirmDialog('恢复为示例数据？当前分类与网站将被覆盖。', ()=>{
        store = seedStore();
        homeCat = 'all';
        localStorage.removeItem(UNLOCK_KEY);
        saveStore();
        applyBrand(); renderHome();
        closeMask($('#settingsMask'));
        toast('已恢复示例数据');
      });
      return;
    }
    if(e.target.closest('#lockOk')){ checkLock(); return; }
    if(e.target.closest('#confirmNo')){ closeMask($('#confirmMask')); return; }
    if(e.target.closest('#confirmYes')){ closeMask($('#confirmMask')); if(confirmCb) confirmCb(); return; }
    return;
  }
  // 分类筛选
  if(t.hasAttribute('data-cat')){ homeCat = t.dataset.cat; renderHome(); return; }
  // 关闭按钮
  if(t.hasAttribute('data-close')){
    closeMask($('#'+t.dataset.close));
    if(t.dataset.close==='catMask' && $('#linkMask').classList.contains('open')){
      renderCatDD();
      const c = catById(linkCatId);
      if(c) renderColorPicker('#lf-color', c.color);
    }
    return;
  }
  // 分段开关
  if(t.hasAttribute('data-seg')){ setSeg(t.dataset.seg, t.dataset.v); return; }
  // 删除分类
  if(t.hasAttribute('data-delcat')){
    const c = catById(t.dataset.delcat); if(!c) return;
    const n = linksOfCat(c.id).length;
    confirmDialog('删除分类「'+c.name+'」？其下 '+n+' 个网站将一并删除。', ()=>{
      store.categories = store.categories.filter(x=>x.id!==c.id);
      store.links = store.links.filter(x=>x.cat!==c.id);
      if(homeCat===c.id) homeCat='all';
      saveStore(); renderCatList(); renderHome();
      toast('分类已删除');
    });
    return;
  }
  // 卡片操作
  if(t.hasAttribute('data-op')){
    e.preventDefault();
    const id = t.dataset.id;
    const i = store.links.findIndex(x=>x.id===id);
    if(i<0) return;
    if(t.dataset.op==='edit'){ openLinkForm(id); return; }
    if(t.dataset.op==='del'){
      const l = store.links[i];
      confirmDialog('删除网站「'+l.name+'」？', ()=>{
        store.links.splice(i,1);
        saveStore(); renderHome();
        toast('已删除');
      });
      return;
    }
  }
});

const LONG_MS = 450;
const DRAG_TOL = 8;
function enterEditMode(){

/* FLIP：让网格里其他卡片平滑滑到新位置 */
function flipOthers(prevRects){
  $$('#goodsGrid .card').forEach(c=>{
    if(c.classList.contains('dragging')) return;
    const p = prevRects.get(c);
    if(!p) return;
    const r = c.getBoundingClientRect();
    const dx = p.left - r.left, dy = p.top - r.top;
    if(!dx && !dy) return;
    c.style.transition = 'none';
    c.style.transform = `translate(${dx}px, ${dy}px)`;
    c.getBoundingClientRect();
    c.style.transition = 'transform .22s ease';
    c.style.transform = '';
    c.addEventListener('transitionend', function h(){
      c.style.transition = '';
      c.removeEventListener('transitionend', h);
    });
  });
}
document.addEventListener('pointerdown', e=>{
  suppressClick = false;                     // 新手势开始，清掉上次残留（修：按钮要点好几次）
  const card = e.target.closest('.card');
  if(!card) return;
  if(e.target.closest('.card-ops')) return;  // 点操作按钮不触发
  dragState = {
    id: card.dataset.id,
    startX: e.clientX, startY: e.clientY,
    moved:false, ghost:null, ph:null, offX:0, offY:0,
    timer: setTimeout(()=>{
      if(dragState && !dragState.moved){
        suppressClick = true;
        enterEditMode();
      }
    }, LONG_MS)
  };
});
document.addEventListener('pointermove', e=>{
  const ds = dragState;
  if(!ds) return;
  const dx = e.clientX - ds.startX, dy = e.clientY - ds.startY;
  if(!ds.moved && Math.hypot(dx,dy) > DRAG_TOL){
    ds.moved = true;
    clearTimeout(ds.timer);
    suppressClick = true;
    beginDrag(ds, e);
  }
  if(ds.moved && ds.ghost){
    ds.ghost.style.transform = `translate(${e.clientX - ds.offX}px, ${e.clientY - ds.offY}px)`;
    reorderAt(ds, e.clientX, e.clientY);
  }
});
/* 开始拖拽：抽出幽灵卡片（固定定位跟随指针）+ 原位置留静态占位（不参与排序） */
function beginDrag(ds, e){
  const card = $('.card[data-id="'+ds.id+'"]');
  if(!card) return;
  const rect = card.getBoundingClientRect();
  const ph = document.createElement('div');
  ph.className = 'card-ph';
  ph.style.width = rect.width+'px';
  ph.style.height = rect.height+'px';
  card.parentNode.insertBefore(ph, card);
  card.classList.add('dragging');
  card.style.position='fixed';
  card.style.left='0'; card.style.top='0';
  card.style.width=rect.width+'px'; card.style.height=rect.height+'px';
  card.style.margin='0'; card.style.zIndex='60';
  card.style.transition='transform .12s ease';
  document.body.appendChild(card);
  ds.ghost = card;
  ds.ph = ph;
  ds.offX = e.clientX - rect.left;
  ds.offY = e.clientY - rect.top;
  card.style.transform = `translate(${e.clientX - ds.offX}px, ${e.clientY - ds.offY}px)`;
}
/* 拖动中：只根据指针计算目标插入位置并高亮（不移动 DOM，杜绝闪烁） */
function reorderAt(ds, x, y){
  const grid = $('#goodsGrid');
  const ph = ds.ph;
  const cards = $$('#goodsGrid .card');
  if(!cards.length) return;
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  // 用指针位置找最近卡片（行优先：优先同一行，避免跨行跳变）
  let best = Infinity, idx = 0;
  cards.forEach((c, i)=>{
    const r = c.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dy = Math.abs(cy - y), dx = Math.abs(cx - x);
    const score = cols<=1 ? dy : (dy*2.5 + dx);
    if(score < best){ best = score; idx = i; }
  });
  const r = cards[idx].getBoundingClientRect();
  const before = cols<=1 ? (y < r.top + r.height/2) : (x < r.left + r.width/2);
  const next = before ? cards[idx] : cards[idx].nextSibling;
  if(ph.nextSibling === next) return;   // 占位格已在目标位置，跳过（避免反复插入闪烁）
  const prev = new Map();
  $$('#goodsGrid .card').forEach(c=>prev.set(c, c.getBoundingClientRect()));
  grid.insertBefore(ph, next);
  flipOthers(prev);
}
function endDragGesture(){
  const ds = dragState;
  if(!ds) return;
  clearTimeout(ds.timer);
  if(ds.moved && ds.ghost){
    const g = ds.ghost, ph = ds.ph;
    const prev = new Map();
    $$('#goodsGrid .card').forEach(c=>prev.set(c, c.getBoundingClientRect()));
    ph.parentNode.replaceChild(g, ph);
    g.classList.remove('dragging');
    ['position','left','top','width','height','margin','zIndex','transition','transform'].forEach(p=>g.style.removeProperty(p));
    // 以 DOM 顺序同步数据
    const order = $$('#goodsGrid .card').map(el=>el.dataset.id)
      .map(id=>store.links.find(l=>l.id===id)).filter(Boolean);
    if(order.length) store.links = order;
    saveStore();
    flipOthers(prev);
  }
  dragState = null;
}
document.addEventListener('pointerup', endDragGesture);
document.addEventListener('pointercancel', endDragGesture);
/* 手势结束后抑制随之而来的点击（避免误开链接） */
document.addEventListener('click', e=>{
  if(suppressClick){ suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  if(editMode && e.target.closest('.card') && !e.target.closest('.card-ops')){
    e.preventDefault(); e.stopPropagation();
  }
}, true);
/* 长按时不弹系统菜单 / 移动端长按不弹右键 */
document.addEventListener('contextmenu', e=>{
  if(e.target.closest('.card')) e.preventDefault();
});
/* 编辑模式按 Esc 退出 */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && editMode) exitEditMode();
});
/* ---------- 启动 ---------- */
applyBrand();
renderHome();
tickClock();
setInterval(tickClock, 1000);
loadWeather();
if(needLock()){
  openMask($('#lockScreen'));
  setTimeout(()=>$('#lockPwd').focus(), 60);
} else {
  $('#lockBtn').style.display = store.settings.pwdEnabled ? 'inline-flex' : 'none';
}
</script>
</body>
</html>
